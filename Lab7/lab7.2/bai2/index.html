<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý User</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        color: #333;
      }

      h3 {
        font-size: 18px;
        font-weight: normal;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      th {
        color: #555;
        font-weight: normal;
      }

      tr:hover {
        background: #f5f5f5;
      }

      button {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 18px;
      }

      select {
        padding: 8px;
        border: 1px solid #ccc;
        background: white;
      }
    </style>
  </head>
  <body>
    <h3>Bảng Danh Sách Users</h3>

    <table>
      <thead>
        <tr>
          <th>STT</th>
          <th>Tên</th>
          <th>Email</th>
          <th>Số điện thoại</th>
          <th>Vai trò</th>
          <th>Chức năng</th>
        </tr>
      </thead>
      <button value=""></button>
      <tbody id="userList"></tbody>
    </table>

    <script type="module" src="./index.js"></script>
  </body>
</html>
